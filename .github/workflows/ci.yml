name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The shared cross-repo acceptance gate for workflow 1 -- owned here,
  # not duplicated into helix-foundry/helix-kernel/helix-cortex's own CI.
  # Neither helix-foundry nor this repo had any CI at all before this;
  # a local "it passed on my machine" run is not evidence by itself.
  # Builds the real Foundry Compose stack (PostgreSQL + the kernel
  # extension + the cortex worker) from the exact sibling commits
  # MANIFEST.md pins and runs the full 5-scenario acceptance.sh against
  # it -- not a smoke test, and nothing here is allowed to skip.
  #
  # Pinned to the SAME helix-foundry/helix-cortex commits as
  # workflow2-acceptance below (see MANIFEST.md): both workflows must be
  # proven against one real stack, not two different ones -- a green
  # workflow-1 check against an older manifest would not show that the
  # Workflow 2 changes (pgvector, new roles/services, the chunk-text
  # input extractor) left workflow 1 intact.
  workflow1-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: helix-labs
      - name: Check out pinned sibling repos (see helix-labs/MANIFEST.md)
        uses: actions/checkout@v4
        with:
          repository: Pg-Helix/helix-foundry
          ref: 762407f8ac4b26c4c22fde4238cc1f55e62974ea
          path: helix-foundry
      - uses: actions/checkout@v4
        with:
          repository: Pg-Helix/helix-kernel
          ref: 0f5bec3ee5f5f9506d0be87c1bec856836d10080
          path: helix-kernel
      - uses: actions/checkout@v4
        with:
          repository: Pg-Helix/helix-cortex
          ref: 74213448fcd5d8521263098b6bd65db7885041ef
          path: helix-cortex
      - name: Use the classic (non-sandboxed) buildx driver
        # GH-hosted runners default to the "docker-container" buildx
        # driver, which runs BuildKit in its own container and enforces
        # filesystem-read entitlements for anything outside a build's
        # own context -- exactly how helix-foundry's docker-compose.yml
        # is written (build context in helix-kernel/helix-cortex,
        # Dockerfile living in helix-foundry's images/ dir). The
        # classic "docker" driver builds inside the host daemon with no
        # such sandbox, matching local dev where this already works.
        run: docker buildx use default
      - name: Run the full workflow-1 acceptance gate
        env:
          COMPOSE_BAKE: "false"
        run: cd helix-labs/workflow-1 && sh acceptance.sh

  # The Workflow 2 acceptance gate (ADR-0007): authorized ingestion,
  # hybrid retrieval, extractive answers with citations, and revocable
  # access, against the real cortex-api/chunk-worker binaries and a real
  # PostgreSQL+pgvector. Same sibling commits as workflow1-acceptance
  # above (see MANIFEST.md) -- one real stack, both gates. Mock
  # embeddings throughout (the default profile) -- the real-model-eval
  # job below is what exercises the real embedding provider.
  workflow2-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: helix-labs
      - name: Check out pinned sibling repos (see helix-labs/MANIFEST.md)
        uses: actions/checkout@v4
        with:
          repository: Pg-Helix/helix-foundry
          ref: 762407f8ac4b26c4c22fde4238cc1f55e62974ea
          path: helix-foundry
      - uses: actions/checkout@v4
        with:
          repository: Pg-Helix/helix-kernel
          ref: 0f5bec3ee5f5f9506d0be87c1bec856836d10080
          path: helix-kernel
      - uses: actions/checkout@v4
        with:
          repository: Pg-Helix/helix-cortex
          ref: 74213448fcd5d8521263098b6bd65db7885041ef
          path: helix-cortex
      - name: Use the classic (non-sandboxed) buildx driver
        run: docker buildx use default
      - name: Run the full workflow-2 acceptance gate
        env:
          COMPOSE_BAKE: "false"
        run: cd helix-labs/workflow-2 && sh acceptance.sh

  # Embedding-binding version-change properties (backfill idempotency,
  # binding isolation, dimension-change triggering, a cutover's clean
  # "not yet ready" gap) -- mock bindings throughout (deterministic,
  # fast), same sibling commits as the gates above.
  version-change:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: helix-labs
      - name: Check out pinned sibling repos (see helix-labs/MANIFEST.md)
        uses: actions/checkout@v4
        with:
          repository: Pg-Helix/helix-foundry
          ref: 762407f8ac4b26c4c22fde4238cc1f55e62974ea
          path: helix-foundry
      - uses: actions/checkout@v4
        with:
          repository: Pg-Helix/helix-kernel
          ref: 0f5bec3ee5f5f9506d0be87c1bec856836d10080
          path: helix-kernel
      - uses: actions/checkout@v4
        with:
          repository: Pg-Helix/helix-cortex
          ref: 74213448fcd5d8521263098b6bd65db7885041ef
          path: helix-cortex
      - name: Use the classic (non-sandboxed) buildx driver
        run: docker buildx use default
      - name: Run the embedding-binding version-change gate
        env:
          COMPOSE_BAKE: "false"
        run: cd helix-labs/workflow-2 && sh version-change.sh

  # The real, local CPU embedding profile's evaluation (this milestone):
  # downloads and runs a real ~274MB model via Ollama -- kept in its own
  # job, separate from the fast mock gates above, but REQUIRED: never
  # allowed to skip. A missing/failed download or a crashed run fails
  # this job; score.py additionally fails the job on any unauthorized
  # disclosure or a missed pre-registered acceptance target
  # (helix-labs/eval/PROTOCOL.md) -- no threshold here is adjusted after
  # the fact to manufacture a pass.
  real-model-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: helix-labs
      - name: Check out pinned sibling repos (see helix-labs/MANIFEST.md)
        uses: actions/checkout@v4
        with:
          repository: Pg-Helix/helix-foundry
          ref: 762407f8ac4b26c4c22fde4238cc1f55e62974ea
          path: helix-foundry
      - uses: actions/checkout@v4
        with:
          repository: Pg-Helix/helix-kernel
          ref: 0f5bec3ee5f5f9506d0be87c1bec856836d10080
          path: helix-kernel
      - uses: actions/checkout@v4
        with:
          repository: Pg-Helix/helix-cortex
          ref: 74213448fcd5d8521263098b6bd65db7885041ef
          path: helix-cortex
      - name: Use the classic (non-sandboxed) buildx driver
        run: docker buildx use default
      - name: Run the mock pass (plumbing baseline)
        run: cd helix-labs/eval && sh run-eval.sh mock
      - name: Run the real pass (nomic-embed-text via Ollama)
        run: cd helix-labs/eval && sh run-eval.sh real
      - name: Score both passes against PROTOCOL.md's acceptance targets
        run: cd helix-labs/eval && python3 score.py
      - name: Upload the full report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: helix-labs/eval/report.json
