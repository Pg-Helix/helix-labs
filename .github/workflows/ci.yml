name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every stack-building job resolves its sibling repos through
# prepare-checkouts.sh, which reads MANIFEST.md's "Effective pins" --
# the same command a clean local reproduction runs, so CI and a local
# run cannot test different commits. All of them build with the classic
# builder: GH-hosted runners default to the docker-container buildx
# driver and Compose's Bake path, which enforce filesystem-read
# entitlements for Foundry's out-of-context Dockerfiles (helix-foundry/
# images/* building contexts in helix-kernel/helix-cortex) -- the
# real-model-eval job of run 41101954690 failed exactly there.
# Run 44888181172 then showed ubuntu-latest had moved to ubuntu-26.04,
# whose Compose builds through Bake even with COMPOSE_BAKE=false and
# failed every stack job on the same fs.read request. So: the runner
# image is pinned to the one where COMPOSE_BAKE=false is known to work,
# and buildx's own opt-out disables Bake's filesystem entitlement check
# in case Bake is used anyway (inputs are the pinned commits above).
env:
  COMPOSE_BAKE: "false"
  BUILDX_BAKE_ENTITLEMENTS_FS: "0"

jobs:
  # Fast, deterministic, no Docker: the scorer's evidence contract
  # (empty/missing/malformed/mismatched inputs must fail; hand-computed
  # metrics must match) through its real CLI, plus shell syntax.
  offline-regressions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest -v eval/test_score.py eval/test_evidence.py eval/test_answer_quality.py
      - run: for f in prepare-checkouts.sh workflow-1/*.sh workflow-2/*.sh eval/*.sh; do sh -n "$f"; done

  # The shared cross-repo acceptance gate for workflow 1, against the
  # same pinned stack as everything below.
  workflow1-acceptance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: helix-labs
      - run: sh helix-labs/prepare-checkouts.sh
      - run: docker buildx use default && docker compose version && docker buildx version
      - run: cd helix-labs/workflow-1 && sh acceptance.sh

  # Workflow 2 (ADR-0007): authorized ingestion, hybrid retrieval,
  # extractive answers with citations, revocable access. Mock embeddings.
  workflow2-acceptance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: helix-labs
      - run: sh helix-labs/prepare-checkouts.sh
      - run: docker buildx use default && docker compose version && docker buildx version
      - run: cd helix-labs/workflow-2 && sh acceptance.sh
        env:
          WF2_ARTIFACT_DIR: ${{ github.workspace }}/wf2-logs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: workflow2-logs
          path: wf2-logs
          if-no-files-found: ignore

  # Embedding-binding version-change properties (mock bindings).
  version-change:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: helix-labs
      - run: sh helix-labs/prepare-checkouts.sh
      - run: docker buildx use default && docker compose version && docker buildx version
      - run: cd helix-labs/workflow-2 && sh version-change.sh
        env:
          WF2_ARTIFACT_DIR: ${{ github.workspace }}/wf2-logs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: version-change-logs
          path: wf2-logs
          if-no-files-found: ignore

  # PROTOCOL.md's evaluation: mock (plumbing baseline), real
  # (nomic-embed-text:v1.5 via Ollama, reranker on) and real-norerank
  # (Decision D's alternative), each on its own fresh stack, then one
  # scoring step. Required, never skipped. score.py exits 2 when evidence
  # is missing/invalid (harness problem) and 1 when the evidence is valid
  # but an acceptance target or security gate is missed (product result);
  # either fails this job. Raw results and the report are uploaded.
  real-model-eval:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: helix-labs
      - run: sh helix-labs/prepare-checkouts.sh
      - run: docker buildx use default && docker compose version && docker buildx version
      - name: Replay the /answers threshold calibration (pinned model, dev cases only)
        run: CALIBRATION_OUT="$GITHUB_WORKSPACE/eval-out/calibration-replay.json" sh helix-labs/eval/calibrate.sh
      - name: Mock pass (plumbing baseline)
        run: cd helix-labs/eval && sh run-eval.sh mock
        env:
          WF2_ARTIFACT_DIR: ${{ github.workspace }}/wf2-logs/mock
      - name: Real pass (nomic-embed-text via Ollama, reranker on)
        run: cd helix-labs/eval && sh run-eval.sh real
        env:
          WF2_ARTIFACT_DIR: ${{ github.workspace }}/wf2-logs/real
      - name: Real pass, reranker off (Decision D alternative)
        run: cd helix-labs/eval && sh run-eval.sh real-norerank
        env:
          WF2_ARTIFACT_DIR: ${{ github.workspace }}/wf2-logs/real-norerank
      - name: Score against PROTOCOL.md
        run: |
          cd helix-labs/eval
          set +e
          python3 score.py --report "$GITHUB_WORKSPACE/eval-out/report.json" | tee "$GITHUB_WORKSPACE/eval-out-summary.txt"
          code=${PIPESTATUS[0]}
          { echo '```'; cat "$GITHUB_WORKSPACE/eval-out-summary.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
        shell: bash
      # The frozen answer-quality benchmark (eval/ANSWER-QUALITY.md) on its
      # own fresh served-profile stack. A baseline: exit 0 = valid evidence
      # whatever the quality; 2 = invalid evidence (fails the job).
      - name: Answer-quality benchmark v1 (served profile real-norerank)
        run: cd helix-labs/eval && EVAL_SUITE=answer-quality sh run-eval.sh real-norerank
        env:
          WF2_ARTIFACT_DIR: ${{ github.workspace }}/wf2-logs/answer-quality
      - name: Score the answer-quality benchmark
        run: |
          cd helix-labs/eval
          set +e
          python3 answer_quality.py score results-answer-quality-real-norerank \
            --report "$GITHUB_WORKSPACE/eval-out/report-answer-quality.json" | tee "$GITHUB_WORKSPACE/eval-out-answer-quality.txt"
          code=${PIPESTATUS[0]}
          { echo '```'; cat "$GITHUB_WORKSPACE/eval-out-answer-quality.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-evidence
          path: |
            eval-out
            helix-labs/eval/results-*
            wf2-logs
          if-no-files-found: warn
